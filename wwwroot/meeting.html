<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join meeting - Rendezvous</title>

    <link rel="stylesheet" href="/css/meeting.css">

</head>

<body>
    <main class="meeting-card">
        <div class="brand">Rendezvous</div>

        <h1 id="meetingTitle">Loading meeting...</h1>

        <p class="description" id="meetingDescription"></p>

        <section class="details">
            <div class="detail-row">
                <span class="label">Meeting code</span>
                <span class="value" id="meetingCode">—</span>
            </div>

            <div class="detail-row">
                <span class="label">Status</span>
                <span class="value">
                    <span class="status" id="meetingStatus">Loading...</span>
                </span>
            </div>

            <div class="detail-row">
                <span class="label">Created</span>
                <span class="value" id="createdAt">—</span>
            </div>
        </section>

        <!-- Join Meeting Form -->
        <section class="join-section" id="joinSection">
            <h2>Join this meeting</h2>

            <p>Enter your name to join the meeting.</p>

            <form id="joinForm">
                <label for="displayName">Your display name</label>

                <input type="text" id="displayName" name="displayName" placeholder="Enter your name" maxlength="100"
                    required>

                <button type="submit" id="joinButton">
                    Join Meeting
                </button>
            </form>
        </section>

        <!-- Displayed after the user submits the form -->
        <section class="joined-section" id="joinedSection" hidden>
            <div id="conferencePopup" class="conference-popup">

                <div class="conference-window">

                    <!-- Popup header -->
                    <header class="conference-header">
                        <div>
                            <h2 id="conferenceTitle">OpenMeet Meeting</h2>
                            <p>Live video conference</p>
                        </div>

                        <button type="button" id="closeConferenceButton" class="close-conference-button"
                            aria-label="Close conference">
                            &times;
                        </button>
                    </header>


                    <!-- Main conference content -->
                    <main class="conference-main">

                        <section class="conference-video-section">

                            <div id="videoGrid" class="video-grid">

                                <!-- Current user's video tile -->
                                <div class="video-card" id="localVideoCard">

                                    <video id="localVideo" autoplay muted playsinline>
                                    </video>

                                    <button type="button" class="video-fullscreen-button"
                                        data-fullscreen-target="localVideoCard"
                                        aria-label="View your video in full screen" title="Full screen">
                                        ⛶
                                    </button>

                                    <div class="video-label">
                                        <span id="localParticipantName">You (me)</span>
                                    </div>

                                </div>

                                <!-- Remote participants' tiles will be added here -->
                                <div id="remoteVideos" class="remote-videos"></div>

                            </div>

                        </section>

                        <div class="right-sidebar-container">
                            <!-- Participants sidebar -->
                            <aside id="participantsSidebar" class="participants-sidebar" hidden>

                                <h3>Participants</h3>

                                <ul id="participantsList"></ul>

                            </aside>
                            <!-- Chat sidebar -->
                            <aside id="chatSidebar" class="chat-sidebar" hidden>

                                <div class="chat-header">
                                    <h3>Chat</h3>
                                </div>

                                <div id="chatMessages" class="chat-messages">
                                    <!-- Chat messages will appear here -->
                                </div>

                                <div class="chat-input-area">

                                    <input type="text" id="chatInput" placeholder="Type a message..." maxlength="2000"
                                        autocomplete="off" />

                                    <button type="button" id="sendChatButton">
                                        Send
                                    </button>

                                </div>

                            </aside>
                        </div>

                    </main>


                    <!-- Conference controls -->
                    <footer class="conference-controls">

                        <button type="button" id="micButton" class="conference-control-button"
                            aria-label="Mute microphone" title="Mute microphone">
                            <span class="control-icon" id="micButtonIcon" aria-hidden="true">🎤</span>
                            <span id="micButtonText">Mute microphone</span>
                        </button>

                        <button type="button" id="cameraButton" class="conference-control-button"
                            aria-label="Turn camera off" title="Turn camera off">
                            <span class="control-icon" id="cameraButtonIcon" aria-hidden="true">📷</span>
                            <span id="cameraButtonText">Turn camera off</span>
                        </button>


                        <button type="button" id="chatToggleButton" class="conference-control-button">

                            <span class="control-icon" aria-hidden="true">💬</span>

                            <span>Chat</span>
                        </button>


                        <button type="button" id="participantsToggleButton" class="conference-control-button">

                            <span class="control-icon" aria-hidden="true">👥</span>

                            <span>Participants</span>
                        </button>

                        <button type="button" id="endMeetingButton" class="conference-control-button end-meeting-button"
                            hidden>
                            End Meeting
                        </button>

                        <button type="button" id="leaveButton" class="conference-control-button leave-button">
                            Leave meeting
                        </button>

                    </footer>

                </div>

            </div>
        </section>

        <p class="message" id="errorMessage"></p>

        <a class="back-link" href="/">← Back to home</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@9.0.6/dist/browser/signalr.min.js"></script>
    <script src="/js/meeting.js"></script>

</body>

</html>
