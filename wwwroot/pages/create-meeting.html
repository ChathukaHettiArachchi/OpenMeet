<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Meeting - Rendezvous</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="navbar">
        <a href="/" class="logo">Rendezvous</a>

        <nav>
            <a href="/">Home</a>
            <!-- <a href="/pages/create-meeting.html">Create Meeting</a> -->
        </nav>
    </header>

    <main class="form-container">

        <section class="meeting-card">

            <h1>Create a Meeting</h1>

            <p class="form-description">
                Start a conference and invite others using a meeting link.
            </p>

            <form id="createMeetingForm">

                <div class="form-group">
                    <label for="title">Meeting Title</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter meeting title"
                        maxlength="100"
                        required>
                </div>

                <div class="form-group">
                    <label for="description">
                        Description (Optional)
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        maxlength="500"
                        placeholder="What is this meeting about?"></textarea>
                </div>

                <button type="submit" id="createMeetingButton"
                        class="primary-button">
                    Create Meeting
                </button>

            </form>

            <div id="message" class="message" hidden></div>

            <section id="meetingResult" class="meeting-result" hidden>

                <h2>Your meeting is ready!</h2>

                <p>Share this link with the people you want to invite.</p>

                <div class="meeting-link-container">
                    <input type="text" id="meetingLink" readonly>

                    <button type="button" id="copyLinkButton">
                        Copy Link
                    </button>
                </div>

                <a id="enterMeetingButton"
                   class="primary-button"
                   href="#">
                    Enter Meeting
                </a>

            </section>

            <div class="back-link">
                <a href="/">Back to Home</a>
            </div>

        </section>

    </main>

    <script src="/js/app.js"></script>

</body>
</html>
